<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nusantara Travel | Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<header>
 <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
 <div class="container-fluid">
 <a class="navbar-brand" href="index.html">Nusantara Travel</a>
 <div class="collapse navbar-collapse">
 <ul class="navbar-nav me-auto mb-2 mb-lg-0">
 <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
 <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
 <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
 <li class="nav-item"><a class="nav-link" href="packages.html">Packages</a></li>
 <li class="nav-item"><a class="nav-link" href="plan.html">Plan Your Trip</a></li>
 <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
 </ul>
 </div>
 </div>
 </nav>
</header>

<main class="container my-5" style="max-width: 420px;">
 <h1 class="h3">Admin login</h1>
 <p class="text-muted small">Only Nusantara Travel staff can add, edit or delete destinations, packages, or view enquiries.</p>

 <div id="loginNotification" class="alert d-none" role="status"></div>

 <form id="loginForm" novalidate>
   <div class="mb-3">
     <label for="username" class="form-label">Username</label>
     <input type="text" class="form-control" id="username" required>
   </div>
   <div class="mb-3">
     <label for="password" class="form-label">Password</label>
     <input type="password" class="form-control" id="password" required>
   </div>
   <button type="submit" class="btn btn-primary" id="loginSubmitBtn">Log in</button>
 </form>
</main>

<footer class="bg-dark text-white text-center py-4">
 <div class="container">
 <p class="mb-1">&copy; 2026 Nusantara Travel</p>
 <p class="mb-0 footer-meta" id="lastUpdated">Page last updated: —</p>
 </div>
</footer>

</body>
</html>
